name: Android build check
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'README.md'   # 오픈소스 고지 테스트가 README 출처 표를 읽는다
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Unit tests, lint, debug APK
        run: |
          chmod +x gradlew
          ./gradlew :chatoon:testDebugUnitTest :chatoon:lintDebug :chatoon:assembleDebug --console=plain
      # 제출물은 R8로 줄인 release다. 서명 키가 없는 CI에서는 서명 없이 만들어 R8 규칙·축소 오류만 잡는다.
      - name: Release APK (R8, unsigned)
        run: ./gradlew :chatoon:assembleRelease :chatoon:lintRelease --console=plain
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/chatoon/build/reports/
            app/chatoon/build/test-results/
